// Publishes the goreleaser-built plugin binaries to Entur's Artifactory as a Maven artifact with
// one classifier per platform, which is the shape protobuf-maven-plugin's `binary-maven` plugin
// resolution expects.
//
// Upstream publishes the same layout to Maven Central under io.github.pseudomuto; this fork uses
// no.entur.abt so Entur-built binaries never shadow the upstream coordinates in partner-release,
// which also proxies Maven Central.
//
// Usage: goreleaser build --clean (writes dist/), then gradle publish.

plugins {
  id 'maven-publish'
}

group = 'no.entur.abt'

// Map os-maven-plugin classifiers to the goreleaser target they are built from. The dist directory
// names carry a GOAMD64/GOARM64 variant suffix (_v1, _v8.0), so the target is matched as a prefix.
def platforms = [
  'linux-x86_64'   : 'linux_amd64',
  'linux-aarch_64' : 'linux_arm64',
  'osx-x86_64'     : 'darwin_amd64',
  'osx-aarch_64'   : 'darwin_arm64',
  'windows-x86_64' : 'windows_amd64',
  'windows-aarch_64': 'windows_arm64',
]

def distDir = layout.projectDirectory.dir('dist')
def stagingDir = layout.buildDirectory.dir('dist')

// Version is supplied by the caller via -Pversion=<x> - see the "Determine version" steps in
// .github/workflows/release.yaml (tag without the leading 'v') and snapshot.yaml
// (0.0.0-SNAPSHOT). Falls back to a local snapshot when building outside those workflows.
if (version == 'unspecified') {
  version = 'local-SNAPSHOT'
}

// Collects each platform binary under a stable, classifier-derived name. Publishing straight out of
// dist/ is not an option: every target ships a file called protoc-gen-doc(.exe), and same-named
// artifacts collide in the publication.
tasks.register('collectBinaries') {
  description = 'Copies the goreleaser binaries into build/dist, one file per Maven classifier'

  inputs.dir(distDir)
  outputs.dir(stagingDir)

  doLast {
    def dist = distDir.asFile
    if (!dist.directory) {
      throw new GradleException("${dist} does not exist - run 'goreleaser build --clean' first")
    }

    stagingDir.get().asFile.with {
      deleteDir()
      mkdirs()
    }

    platforms.each { classifier, target ->
      def candidates = dist.listFiles({ File f ->
        f.directory && (f.name == "protoc-gen-doc_${target}" || f.name.startsWith("protoc-gen-doc_${target}_"))
      } as FileFilter)

      if (candidates == null || candidates.length != 1) {
        throw new GradleException(
          "expected exactly one dist directory for ${target}, found ${candidates?.collect { it.name }}")
      }

      def binary = new File(candidates[0], target.startsWith('windows') ? 'protoc-gen-doc.exe' : 'protoc-gen-doc')
      if (!binary.file) {
        throw new GradleException("${binary} is missing from the goreleaser output")
      }

      def staged = new File(stagingDir.get().asFile, "protoc-gen-doc-${classifier}.exe")
      staged.bytes = binary.bytes
      staged.setExecutable(true, false)
    }
  }
}

publishing {
  publications {
    maven(MavenPublication) {
      groupId = project.group
      artifactId = rootProject.name
      version = project.version

      platforms.each { platformClassifier, target ->
        artifact("${stagingDir.get().asFile}/protoc-gen-doc-${platformClassifier}.exe") {
          classifier platformClassifier
          extension 'exe'
          builtBy tasks.named('collectBinaries')
        }
      }

      pom {
        name = "${project.group}:${rootProject.name}"
        description = 'Entur fork of protoc-gen-doc, a documentation generator plugin for the ' +
          'Google Protocol Buffers compiler (protoc). Carries upstream PR #536 (buf validate / ' +
          'protovalidate support) ahead of it being merged upstream.'
        url = 'https://github.com/entur/protoc-gen-doc'
        licenses {
          license {
            name = 'MIT License'
            url = 'https://github.com/entur/protoc-gen-doc/blob/master/LICENSE.md'
          }
        }
        developers {
          developer {
            id = 'pseudomuto'
            name = 'David Muto'
            email = 'david.muto@gmail.com'
          }
          developer {
            id = 'entur'
            name = 'Entur'
            email = 'support@entur.org'
          }
        }
        scm {
          connection = 'scm:git:git@github.com:entur/protoc-gen-doc.git'
          developerConnection = 'scm:git:git@github.com:entur/protoc-gen-doc.git'
          url = 'https://github.com/entur/protoc-gen-doc'
        }
      }
    }
  }

  repositories {
    maven {
      name = 'entur-partner'
      // note: SNAPSHOT versions go to partner-snapshot, everything else to partner-release,
      url = "https://entur2.jfrog.io/entur2/${version.endsWith('SNAPSHOT') ? 'partner-snapshot' : 'partner-release'}"
      credentials {
        def mavenUsername = System.env.MAVEN_USERNAME
        def mavenPassword = System.env.MAVEN_PASSWORD
        if (!mavenUsername || !mavenPassword) {
          throw new GradleException('MAVEN_USERNAME and MAVEN_PASSWORD environment variables must both be set to publish to Artifactory')
        }
        username = mavenUsername
        password = mavenPassword
      }
    }
  }
}
