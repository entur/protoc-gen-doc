name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Test
        run: |
          go test ./ ./cmd/... ./extensions/...
          golangci-lint run ./...
      - name: Build binaries
        run: goreleaser build --clean
      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: liberica
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Determine version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # Publishes no.entur.abt:protoc-gen-doc:<tag without the leading v> to partner-release, with
      # one .exe artifact per platform classifier.
      - name: Publish to Artifactory
        env:
          MAVEN_USERNAME: ${{ secrets.PARTNER_WRITE_ARTIFACTORY_AUTH_USER }}
          MAVEN_PASSWORD: ${{ secrets.PARTNER_WRITE_ARTIFACTORY_AUTH_TOKEN }}
        run: ./gradlew publish -Pversion="${VERSION}"
      - name: Summarise
        run: echo "Published no.entur.abt:protoc-gen-doc:${VERSION} to partner-release" >> $GITHUB_STEP_SUMMARY
