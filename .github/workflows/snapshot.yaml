name: Publish snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Test
        run: |
          go test ./ ./cmd/... ./extensions/...
          golangci-lint run ./...
      # --snapshot uses .goreleaser.yaml's snapshot.version_template ("{{ incpatch .Version }}-next"
      # by default). goreleaser writes the resolved version to dist/metadata.json.
      - name: Build binaries
        run: goreleaser build --snapshot --clean
      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: liberica
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Extracts the version goreleaser computed for this snapshot build and ensures it carries a
      # "-SNAPSHOT" suffix, since build.gradle routes to partner-snapshot vs. partner-release based
      # on that suffix.
      - name: Determine version
        run: |
          RAW_VERSION=$(jq -r '.version' dist/metadata.json)
          if [[ "${RAW_VERSION}" != *-SNAPSHOT ]]; then
            RAW_VERSION="${RAW_VERSION}-SNAPSHOT"
          fi
          echo "VERSION=${RAW_VERSION}" >> "$GITHUB_ENV"
      # Publishes no.entur.abt:protoc-gen-doc:<version> to partner-snapshot, with one .exe artifact
      # per platform classifier.
      - name: Publish snapshot to Artifactory
        env:
          MAVEN_USERNAME: ${{ secrets.PARTNER_READ_WRITE_ARTIFACTORY_AUTH_USER }}
          MAVEN_PASSWORD: ${{ secrets.PARTNER_WRITE_ARTIFACTORY_AUTH_TOKEN }}
        run: gradle publish -Pversion="${VERSION}"
      - name: Summarise
        run: echo "Published no.entur.abt:protoc-gen-doc:${VERSION} to partner-snapshot" >> $GITHUB_STEP_SUMMARY
